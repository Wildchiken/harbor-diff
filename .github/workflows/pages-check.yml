name: Published Pages check

on:
  workflow_run:
    workflows: ['pages-build-deployment']
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/pages-check.yml']

permissions:
  contents: read

jobs:
  published-assets:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Compare published assets with the repository
        shell: bash
        env:
          PAGES_URL: https://wildchiken.github.io/harbor-diff
        run: |
          set -euo pipefail
          published_dir="$(mktemp -d)"
          failed=0
          assets=(index.html styles.css src/app.js src/har-core.js src/demo.js assets/logo.svg assets/overview.svg compare-har-files.html guide.css sitemap.xml examples/before.har examples/after.har examples/report.md examples/report.json)

          echo "Checking public assets against commit $(git rev-parse HEAD)."
          printf '## Published Pages assets\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Expected commit: `%s`\n\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

          for asset in "${assets[@]}"; do
            published_file="$published_dir/${asset//\//_}"
            matched=0

            # Retry both HTTP failures and stale CDN contents for a bounded period.
            for attempt in 1 2 3 4; do
              echo "Fetching $asset (attempt $attempt/4)."
              if curl --fail --silent --show-error --location \
                --proto '=https' --proto-redir '=https' \
                --connect-timeout 5 --max-time 15 \
                --header 'Cache-Control: no-cache' \
                --output "$published_file" "$PAGES_URL/$asset"; then
                if cmp --silent "$asset" "$published_file"; then
                  echo "Verified $asset: published bytes match the repository."
                  matched=1
                  break
                fi
                echo "::warning::$asset was fetched but differs from the default branch."
                echo "Expected SHA-256: $(sha256sum "$asset" | cut -d ' ' -f 1)"
                echo "Published SHA-256: $(sha256sum "$published_file" | cut -d ' ' -f 1)"
              else
                echo "::warning::Could not fetch $asset over HTTPS."
              fi
              if [ "$attempt" -lt 4 ]; then sleep 5; fi
            done

            if [ "$matched" -eq 1 ]; then
              printf -- '- Verified `%s`\n' "$asset" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::error::$asset could not be verified after 4 attempts. Check the Pages deployment and the expected commit above."
              printf -- '- FAILED `%s`: unavailable or different from the repository.\n' "$asset" >> "$GITHUB_STEP_SUMMARY"
              failed=1
            fi
          done

          exit "$failed"
