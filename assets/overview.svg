<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">HarborDiff: Two HAR files. A clear network diff.</title>
  <desc id="description">Illustration of a synthetic before and after comparison. The cart response changes from HTTP 200 to 500. The collection image response body grows from 44,000 to 1,244,000 bytes. Product requests increase from one to four calls. Compare locally in your browser and export a Markdown or JSON report. These are synthetic example values, not production measurements.</desc>
  <rect width="1200" height="660" rx="20" fill="#f8f6f1"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#202727">
    <path d="M56 54h8v14h16V54h8v38h-8V76H64v16h-8z" fill="#e85836"/>
    <text x="101" y="84" font-size="27" font-weight="700" letter-spacing="-0.8">HarborDiff</text>
    <rect x="949" y="53" width="195" height="36" rx="18" fill="#fff0e9"/>
    <text x="1046" y="77" text-anchor="middle" font-size="15" font-weight="600" fill="#a83c23">Synthetic example</text>

    <text x="56" y="161" font-size="46" font-weight="650" letter-spacing="-1.8">Two HAR files. A clear network diff.</text>
    <text x="58" y="195" font-size="19" fill="#5d6863">Spot new errors, larger responses, and repeated requests.</text>

    <rect x="56" y="227" width="1088" height="306" rx="12" fill="#fffefa" stroke="#dddeda"/>
    <path d="M56 282H1144M56 364H1144M56 447H1144" stroke="#dddeda"/>
    <text x="83" y="261" font-size="14" font-weight="600" letter-spacing="0.7" fill="#5d6863">REQUEST</text>
    <text x="717" y="261" font-size="14" font-weight="600" letter-spacing="0.7" fill="#5d6863" text-anchor="end">BEFORE</text>
    <text x="1116" y="261" font-size="14" font-weight="600" letter-spacing="0.7" fill="#a83c23" text-anchor="end">AFTER</text>

    <text x="83" y="316" font-size="20" font-weight="600">Cart</text>
    <text x="83" y="342" font-size="15" fill="#5d6863">/api/cart · HTTP status</text>
    <text x="717" y="333" font-size="28" font-weight="600" text-anchor="end">200</text>
    <path d="M774 322h34m-7-7 7 7-7 7" fill="none" stroke="#a1aaa4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1023" y="300" width="94" height="44" rx="7" fill="#fff0e9"/>
    <text x="1099" y="333" font-size="28" font-weight="650" fill="#ad3e25" text-anchor="end">500</text>

    <text x="83" y="398" font-size="20" font-weight="600">Collection image</text>
    <text x="83" y="424" font-size="15" fill="#5d6863">/images/summer-collection.webp · body bytes</text>
    <text x="717" y="415" font-size="28" font-weight="600" text-anchor="end">44,000</text>
    <path d="M774 404h34m-7-7 7 7-7 7" fill="none" stroke="#a1aaa4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="937" y="382" width="180" height="44" rx="7" fill="#fff0e9"/>
    <text x="1099" y="415" font-size="28" font-weight="650" fill="#ad3e25" text-anchor="end">1,244,000</text>

    <text x="83" y="482" font-size="20" font-weight="600">Products</text>
    <text x="83" y="508" font-size="15" fill="#5d6863">/api/products · request count</text>
    <text x="717" y="499" font-size="28" font-weight="600" text-anchor="end">1 call</text>
    <path d="M774 488h34m-7-7 7 7-7 7" fill="none" stroke="#a1aaa4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1000" y="466" width="117" height="44" rx="7" fill="#fff0e9"/>
    <text x="1099" y="499" font-size="28" font-weight="650" fill="#ad3e25" text-anchor="end">4 calls</text>

    <g fill="none" stroke="#437160" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="59" y="575" width="24" height="19" rx="3"/>
      <path d="M59 581h24m-17 19h10m-5-6v6"/>
      <path d="M579 575h15l7 7v20h-22zm15 0v8h7m-16 6h10m-10 6h10"/>
    </g>
    <text x="98" y="591" font-size="18" font-weight="600">Compare locally in your browser</text>
    <text x="620" y="591" font-size="18" font-weight="600">Export Markdown or JSON</text>
    <text x="98" y="617" font-size="15" fill="#5d6863">HAR contents stay on your device.</text>
    <text x="620" y="617" font-size="15" fill="#5d6863">Anonymous request IDs by default.</text>
  </g>
</svg>
